# nginx: сайт gornitsa.games
# HTTPS (порт 443) и редирект с http добавит certbot командой из setup-server.sh.

server {
    listen 80;
    listen [::]:80;
    server_name gornitsa.games www.gornitsa.games;

    root /var/www/gornitsa.games;
    # места игр со своими правилами (закрытая веб-версия «Узоров» — deploy/uzory/nginx.sh):
    # файлы пишут скрипты игр; нет ни одного — строка ничего не делает
    include /etc/nginx/snippets/gornitsa.games-*.conf;
    index index.html;
    charset utf-8;

    # www -> без www
    if ($host = www.gornitsa.games) {
        return 301 $scheme://gornitsa.games$request_uri;
    }

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    # /support и /privacy открываются и без .html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Шрифты не меняются — кэшируем надолго
    location /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Стили, скрипты, картинки — на неделю, браузер перепроверит по ETag
    location ~* \.(css|js|svg|png|ico|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/gornitsa.access.log;
    error_log  /var/log/nginx/gornitsa.error.log warn;
}
