# Места сайта gornitsa.games — общие для настройки без HTTPS (gornitsa.games.conf, первая
# установка) и с HTTPS (gornitsa.games.https.conf). На машине:
# /etc/nginx/snippets/gornitsa-site-locations.conf (ставит deploy/nginx/apply.sh).

# /support и /privacy открываются и без .html
location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
}

# Шрифты не меняются — кэшируем надолго
location /assets/fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
}

# Стили, скрипты, картинки — на неделю, браузер перепроверит по ETag
location ~* \.(css|js|svg|png|webp|ico|xml|txt)$ {
    expires 7d;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 7d;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
}

# Старый адрес политики «Вотчины» (на него может ссылаться карточка RuStore) — настоящая
# переадресация 301 на раздел общей политики. Раньше это была страница с noindex и meta refresh,
# и Search Console считал её «исключённой тегом noindex». src/votchina/privacy.html остаётся
# запасным вариантом для локального просмотра сайта без nginx.
location ~ ^/votchina/privacy(\.html)?/?$ {
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
    return 301 /privacy.html#votchina;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    include /etc/nginx/snippets/gornitsa-site-headers.conf;
}
