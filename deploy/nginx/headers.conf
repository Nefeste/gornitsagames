# Заголовки безопасности сайта gornitsa.games — в каждом location (nginx не складывает add_header
# сервера и location: у location со своим add_header заголовки сервера пропадают).
# На машине: /etc/nginx/snippets/gornitsa-site-headers.conf (ставит deploy/nginx/apply.sh).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
