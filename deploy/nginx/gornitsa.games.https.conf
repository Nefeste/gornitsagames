# nginx: сайт gornitsa.games с HTTPS — этот файл и есть настройка на машине
# (/etc/nginx/sites-available/gornitsa.games.conf). Его ставит deploy/nginx/apply.sh, когда
# меняется deploy/nginx/ и сертификат Let's Encrypt уже выпущен; до сертификата работает
# gornitsa.games.conf из setup-server.sh. Блоки с пометкой «managed by Certbot» — в том виде,
# в каком их пишет certbot: так продление сертификата работает, как раньше.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gornitsa.games www.gornitsa.games;

    ssl_certificate /etc/letsencrypt/live/gornitsa.games/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gornitsa.games/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/gornitsa.games;
    # места игр со своими правилами (закрытая веб-версия «Узоров» — deploy/uzory/nginx.sh):
    # файлы пишут скрипты игр; нет ни одного — строка ничего не делает
    include /etc/nginx/snippets/gornitsa.games-*.conf;
    index index.html;
    charset utf-8;

    # www -> без www
    if ($host = www.gornitsa.games) {
        return 301 https://gornitsa.games$request_uri;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json application/manifest+json;

    include /etc/nginx/snippets/gornitsa-site-locations.conf;

    access_log /var/log/nginx/gornitsa.access.log;
    error_log  /var/log/nginx/gornitsa.error.log warn;
}

# http -> https
server {
    if ($host = www.gornitsa.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gornitsa.games) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name gornitsa.games www.gornitsa.games;
    return 404; # managed by Certbot
}
